name: Validate panel assets

on:
  pull_request:
    paths:
      - 'episodes/**'
      - 'schemas/**'
      - 'operations/**'
      - 'config/decision-policy.json'
      - 'scripts/decision-status.js'
      - 'scripts/release-readiness.js'
      - 'tests/decision-status.test.js'
      - '.github/workflows/validate-assets.yml'
      - '.github/workflows/deploy.yml'
      - 'state.json'
      - 'config/panel-generation-policy.json'
      - 'config/asset-storage-policy.json'
      - 'scripts/build-panel-jobs.js'
      - 'scripts/run-panel-jobs.js'
      - 'scripts/init-episode-governance.js'
      - 'scripts/build-creation-context.js'
      - 'scripts/render-panel-overlays.js'
      - 'scripts/validate-episode-output.js'
      - 'scripts/build-comic-reader.js'
      - 'scripts/build-season-reader.js'
      - 'scripts/validate-season-readiness.js'
      - 'tests/season-release.test.js'
      - 'scripts/validate-episode-governance.js'
      - 'tests/creation-context.test.js'
      - 'tests/render-panel-overlays.test.js'
      - 'scripts/check-panel-assets.js'
  push:
    branches: [main]
    paths:
      - 'episodes/**'
      - 'schemas/**'
      - 'operations/**'
      - 'config/decision-policy.json'
      - 'scripts/decision-status.js'
      - 'scripts/release-readiness.js'
      - 'tests/decision-status.test.js'
      - '.github/workflows/validate-assets.yml'
      - '.github/workflows/deploy.yml'
      - 'state.json'
      - 'config/panel-generation-policy.json'
      - 'config/asset-storage-policy.json'
      - 'scripts/build-panel-jobs.js'
      - 'scripts/run-panel-jobs.js'
      - 'scripts/init-episode-governance.js'
      - 'scripts/build-creation-context.js'
      - 'scripts/render-panel-overlays.js'
      - 'scripts/validate-episode-output.js'
      - 'scripts/build-comic-reader.js'
      - 'scripts/build-season-reader.js'
      - 'scripts/validate-season-readiness.js'
      - 'tests/season-release.test.js'
      - 'scripts/validate-episode-governance.js'
      - 'tests/creation-context.test.js'
      - 'tests/render-panel-overlays.test.js'
      - 'scripts/check-panel-assets.js'

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check panel assets
        run: node scripts/check-panel-assets.js
      - name: Validate episode discovery, decisions, and approvals
        run: node scripts/validate-episode-governance.js
      - name: Validate decision owners, deadlines and evidence
        run: node scripts/decision-status.js --validate
      - name: Validate episode output manifests and release assets
        run: node scripts/validate-episode-output.js EP001 --require-release
      - name: Test creation memory context compiler
        run: node --test tests/*.test.js
      - name: Validate approved full-season package
        run: |
          node scripts/build-season-reader.js
          node scripts/validate-season-readiness.js --require-release
      - name: Show decision waiting report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/decision-status.js --github >> "$GITHUB_STEP_SUMMARY"
