aption></figcaption></figure>

<figure id="p5-2"><img src="../../../episodes/EP004/panels/assets/p5-2.webp" alt="Pope in the Pool: 배경에서 시민들의 대화. 왕먀오가 지나가는 동안 시민들이 대화한다. 시민 A가 하늘을 가리키며." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>시민</strong>태양은 하나다. 항상 그래왔다.</p><p class="dialogue"><strong>학자</strong>관측 기록에 따르면 궤도는 안정적이야. 이번엔 끝나지 않아.</p></figcaption></figure>

<h2 id="page-10">10</h2><figure id="p10-1"><img src="../../../episodes/EP004/panels/assets/p10-1.webp" alt="왕먀오가 기록자를 다시 만난다. 기록자는 돌을 새기고 있다. &quot;191&quot;의 숫자. 기록자 옆에 쌓인 돌탑이 엄청나게 높다 — 191개의 돌. 왕먀오의 키를 넘는다." loading="lazy" decoding="async"><figcaption><p class="caption">191번째 기록</p><p class="dialogue"><strong>왕먀오</strong>당신은… 몇 번이나 이걸 했습니까?</p><p class="dialogue"><strong>기록자</strong>제가 기억하는 한. 전부.</p></figcaption></figure>

<h2 id="page-11">11</h2><figure id="p11-1"><img src="../../../episodes/EP004/panels/assets/p11-1.webp" alt="192번째 문명. 가장 발전했다. 데탕트라이트 건축, 정교한 관측 시스템. 왕먀오가 도시를 걷고 있다. 감탄이 아니라 불안." loading="lazy" decoding="async"><figcaption><p class="caption">192번째 문명</p><p class="narration">이 정도면… 살아남을 수도.</p></figcaption></figure>
<figure id="p11-2"><img src="../../../episodes/EP004/panels/assets/p11-2.webp" alt="하늘이 변한다. 빠르다 — 184번째보다 훨씬 빠르다. 태양이 둘, 셋." loading="lazy" decoding="async"><figcaption><p class="sfx">삐—</p></figcaption></figure>
<figure id="p11-3"><img src="../../../episodes/EP004/panels/assets/p11-3.webp" alt="Pope in the Pool: 왕먀오가 녹아내리는 도서관을 지난다. 책이 타들어간다. 한 페이지가 날려서 왕먀오 발 앞에 떨어진다 — &quot;궤도 예측 불가능&quot; 수식." loading="lazy" decoding="async"><figcaption><p class="caption">궤도 예측 불가능</p></figcaption></figure>

<h2 id="page-12">12</h2><figure id="p12-1"><img src="../../../episodes/EP004/panels/assets/p12-1.webp" alt="멸망 후. 잿빛. 기록자가 마지막 돌을 새기고 있다. &quot;192&quot;. 새김도구의 소리가 페이지에 선으로 표현됨." loading="lazy" decoding="async"><figcaption><p class="caption">192</p><p class="sfx">뚜. 뚝. 뚜.</p></figcaption></figure>
<figure id="p12-2"><img src="../../../episodes/EP004/panels/assets/p12-2.webp" alt="기록자가 돌을 들어 올린다. 탑 위에 올려놓는다 — 탑이 무서울 정도로 높다. 192개의 돌." loading="lazy" decoding="async"><figcaption></figcaption></figure>

<figure id="p12-4"><img src="../../../episodes/EP004/panels/assets/p12-4.webp" alt="왕먀오의 얼굴. 대답하지 못한다. 입이 열려 있으나 소리가 없다. 눈에 192개의 돌탑이 비친다." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<h2 id="page-13">13</h2><figure id="p13-1"><img src="../../../episodes/EP004/panels/assets/p13-1.webp" alt="풀 스프레드. 모래만 있다. 하늘은 희미한 회색. 지면은 모래. 중앙에 돌 하나. &quot;192&quot;가 새겨져 있다. 바람이 분다. 모래가 돌 위로 흩날린다. &quot;192&quot;의 숫자가 서서히 지워진다. 왕먀오는 아주 작게, 페이지 구석에 서 있다 — 혹은 서 있는지조차 불확실하다." loading="lazy" decoding="async"><figcaption><p class="caption">192 — 모래가 마지막 기록을 덮는다.</p></figcaption></figure>

<figure id="p14-2"><img src="../../../episodes/EP004/panels/assets/p14-2.webp" alt="HUD 요소들이 하나씩 사라진다. 깜빡이고, 녹아내리고, 부서진다. 미니맵, 체력 바, 퀘스트 텍스트가 연속적으로 붕괴." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<figure id="p14-3"><img src="../../../episodes/EP004/panels/assets/p14-3.webp" alt="게임의 잿빛 하늘에 균열이 생긴다. 균열 너머로 별이 보인다. 진짜 별. 왕먀오가 하늘을 올려다본다. 입이 벌어진다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>왕먀오</strong>이건…</p></figcaption></figure>
<h2 id="page-15">15</h2><figure id="p15-1"><img src="../../../episodes/EP004/panels/assets/p15-1.webp" alt="풀 페이지. 게임의 잿빛 세계는 완전히 사라졌다. 어둠. 그리고 그 어둠 속에 별 — 진짜 별. 빈 화면에 하나의 메시지만:" loading="lazy" decoding="async"><figcaption><p class="screen">이것은 게임이 아닙니다.</p><p class="screen">192번의 멸망. 이것은 기록입니다.</p></figcaption></figure></main><footer><nav><a href="#">맨 위로</a><a href="../EP005/read.html">다음 화 →</a></nav></footer></html>
