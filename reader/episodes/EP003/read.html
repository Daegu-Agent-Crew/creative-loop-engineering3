<figure id="p1-2"><img src="../../../episodes/EP003/panels/assets/p1-2.webp" alt="왕먀오의 손이 화면 아래에서 올라와 안경을 만진다. 안경 렌즈 가장자리에 카운트다운 숫자 &quot;1198:47:23&quot;가 잠시 비치고 — 사라진다." loading="lazy" decoding="async"><figcaption><p class="screen">1198:47:23</p></figcaption></figure>
<figure id="p1-3"><img src="../../../episodes/EP003/panels/assets/p1-3.webp" alt="멀리, 갈색 평원 위에 검은 점 하나. 사람 실루엣. 고대 중국 복장. 움직이지 않는다. 바람에 옷자락이 살짝 움직이는 것만이 생명의 징후." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<h2 id="page-2">02</h2><figure id="p2-1"><img src="../../../episodes/EP003/panels/assets/p2-1.webp" alt="왕먀오가 걷고 있다. 발소리가 나지 않는다 — 발이 지면에 닿지만 반발력이 약하다. 갈색 대지 위의 발자국이 바로 메워진다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>왕먀오</strong>...이게 삼체 게임?</p></figcaption></figure>
<figure id="p2-2"><img src="../../../episodes/EP003/panels/assets/p2-2.webp" alt="왕먀오가 하늘을 올려다본다. 회백색 돔. 구름도 별도 없다. 그런데 어딘가에서 빛은 오고 있다 — 어디서인지 모르는 확산광." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>왕먀오</strong>태양이 없어.</p></figcaption></figure>
<figure id="p2-3"><img src="../../../episodes/EP003/panels/assets/p2-3.webp" alt="왕먀오의 발밑. 돌 하나가 떠오르기 시작한다 — 중력이 약해지고 있다. 돌이 왕먀오의 무릎 높이까지 떠 있다." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<figure id="p2-4"><img src="../../../episodes/EP003/panels/assets/p2-4.webp" alt="실루엣이 가까워졌다. 고대 중국 복장의 남자 — 주희. 검은 갑옷 위에 붉은 옥의. 돌 위에 앉아 있다. 주변에 아무것도 없다." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<h2 id="page-3">03</h2><figure id="p3-1"><img src="../../../episodes/EP003/panels/assets/p3-1.webp" alt="주희가 왕먀오를 내려다본다. 주희의 키가 왕먀오보다 머리 하나 더 크다. 과장된 비율 — 연극적 위압감. 주희의 미소가 깊어진다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>주희</strong>하늘을 보았느냐.</p></figcaption></figure>
<figure id="p3-2"><img src="../../../episodes/EP003/panels/assets/p3-2.webp" alt="왕먀오가 대답하려는 순간, 주희가 먼저 말을 이어간다. 주희의 입이 넓게 열린다 — 과장된 몸짓. 돌 위에서 일어선다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>주희</strong>하늘은 언제나 우리를 배신하지. 다만, 오늘은 배신하지 않았을 뿐.</p></figcaption></figure>
<figure id="p3-3"><img src="../../../episodes/EP003/panels/assets/p3-3.webp" alt="★ Theme Stated 회수 포인트: 주희의 얼굴 클로즈업. 미소가 사라지고 진지해진다. 입술이 미세하게 움직인다. 눈동자에 왕먀오의 안경이 비친다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>주희</strong>네 안경은 무엇을 보여주느냐?</p></figcaption></figure>
<figure id="p3-4"><img src="../../../episodes/EP003/panels/assets/p3-4.webp" alt="왕먀오의 반응 샷. 멈칫한 표정. 입이 벌어져 있다. 손이 안경테를 만지려다 멈춘다. 배경으로 멀리 천문관 상구가 관측기를 조정하고 있는 것이 보인다." loading="lazy" decoding="async"><figcaption><p class="narration">NPC치고는... 너무 진짜 같다.</p></figcaption></figure>
<h2 id="page-4">04</h2><figure id="p4-1"><img src="../../../episodes/EP003/panels/assets/p4-1.webp" alt="주희가 손을 뻗어 하늘을 가리킨다. 하늘에 구름 한 점 없는 회백색. 그러나 주희의 손끝 방향에 — 미세한 균열처럼 빛이 스며나오는 부분이 있다. 아직은 암시만." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>주희</strong>이것이 안정기(安定期)다. 태양이 규칙적으로 뜰 때를 말하지. 지금은 그 시작을 기다리고 있다.</p></figcaption></figure>
<figure id="p4-2"><img src="../../../episodes/EP003/panels/assets/p4-2.webp" alt="주희의 표정이 변한다. 미소가 사라진다. 처음으로 진지한 얼굴 — 닥터슬럼프풍 과장이 걷히고, 리얼리스틱한 표정이 드러난다. 눈가에 주름. 입술이 일자로 닫힌다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>주희</strong>난세(亂世)가 오면, 모든 것이 끝난다.</p></figcaption></figure>
<figure id="p4-3"><img src="../../../episodes/EP003/panels/assets/p4-3.webp" alt="왕먀오가 하늘을 다시 올려다본다. 이번에는 — 하늘 구석에서 무언가가 번쩍인다. 태양? 아직 보이지 않지만 빛이 번지기 시작한다. 왕먀오의 동공이 확장된다." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<h2 id="page-5">05</h2><figure id="p5-1"><img src="../../../episodes/EP003/panels/assets/p5-1.webp" alt="평원 전경. 갈색 대지 위에 돌들이 떠 있다 — 중력 이상. 작은 돌에서 큰 바위까지 다양한 높이로 부유. 왕먀오가 돌 하나를 잡고 관찰한다." loading="lazy" decoding="async"><figcaption><p class="narration">중력이... 일정하지 않아. 상수가 아니야.</p></figcaption></figure>
<figure id="p5-2"><img src="../../../episodes/EP003/panels/assets/p5-2.webp" alt="왕먀오가 땅에 손을 대본다. 손바닥이 지면에 닿자 손바닥 위의 모래 알갱이들이 미세하게 진동하다 떠오른다. 손바닥에서 빛이 나는 것은 아닌데, 중력이 손바닥 주변에서 약해진다." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<figure id="p5-3"><img src="../../../episodes/EP003/panels/assets/p5-3.webp" alt="멀리서 주희가 지켜보고 있다. 주희의 미소가 돌아와 있다. 팔짱을 끼고 서서 왕먀오를 관찰하는 포즈 — 마치 실험동물을 지켜보는 연구자처럼." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<figure id="p5-4"><img src="../../../episodes/EP003/panels/assets/p5-4.webp" alt="상구(천문관)가 관측 언덕에서 외친다. 청동 관측기 — 큰 원반에 눈금이 새겨진 — 의 데이터를 확인하고 있다. 상구의 얼굴에 안도의 빛." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>상구</strong>안정기가 오고 있습니다! 두 태양의 궤도가 접근하고 있습니다!</p></figcaption></figure>
<h2 id="page-6">06</h2><figure id="p6-1"><img src="../../../episodes/EP003/panels/assets/p6-1.webp" alt="하늘이 갈라진다 — 비유적으로. 회백색 돔에 금이 가듯 두 개의 빛이 번지기 시작. 동쪽에서 큰 붉은 태양, 서쪽에서 작고 흰 태양이 동시에 솟아오른다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>왕먀오</strong>태양이... 둘이야?</p></figcaption></figure>
<figure id="p6-2"><img src="../../../episodes/EP003/panels/assets/p6-2.webp" alt="평원 전경 변화. 갈색 대지가 황금빛으로 물든다. 부유하던 돌들이 서서히 내려앉기 시작 — 중력이 안정화. NPC 문명인들이 멀리서 나타나기 시작 — 주희의 &quot;백성들&quot;. 작은 실루엣들이 평원 위로 퍼진다." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<figure id="p6-3"><img src="../../../episodes/EP003/panels/assets/p6-3.webp" alt="주희가 평원 한가운데 서서 양팔을 벌린다. 두 태양의 빛이 주희의 붉은 옥의를 관통하듯 비춘다. 주희의 그림자가 두 개 — 동쪽과 서쪽으로. 주희의 미소가 돌아왔다 — 과장된, 연극적 미소." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>주희</strong>보아라! 하늘이 우리를 받아들였다!</p></figcaption></figure>
<figure id="p6-4"><img src="../../../episodes/EP003/panels/assets/p6-4.webp" alt="왕먀오의 얼굴. 안경을 닦고 있다. 안경 렌즈에 두 태양이 반사되어 보인다 — 아름답고 기묘한 이미지. 왕먀오의 표정에 미세한 경이가 스친다 — 과학자가 처음으로 &quot;아름답다&quot;고 느끼는 순간." loading="lazy" decoding="async"><figcaption><p class="narration">이건... 아름답다.</p></figcaption></figure>
<h2 id="page-7">07</h2><figure id="p7-1"><img src="../../../episodes/EP003/panels/assets/p7-1.webp" alt="풀 페이지. 두 태양이 황금빛 하늘 양쪽에 떠 있다. 평원 위에 NPC 문명인들이 모여 있다 — 축제. 주희가 언덕 위에 서서 양팔을 벌리고 있고, 그 아래로 사람들이 환호한다. 화면 오른쪽 구석에 왕먀오가 서 있다. 안경에 두 태양이 비친 채로. 고립되어 있으나, 경이에 젖어 있다." loading="lazy" decoding="async"><figcaption><p class="caption">안정기. 문명이 살아남은 기적의 날.</p></figcaption></figure>
<h2 id="page-8">08</h2><figure id="p8-1"><img src="../../../episodes/EP003/panels/assets/p8-1.webp" alt="관측대의 청동 관측기구와 눈금 클로즈업. 상구가 계산 결과를 확인한다. 따뜻한 빛과 대비되는 불안한 침묵." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>상구</strong>이런... 안 돼...</p></figcaption></figure>
<figure id="p8-2"><img src="../../../episodes/EP003/panels/assets/p8-2.webp" alt="하늘의 변화. 두 태양의 균형이 깨지기 시작 — 큰 붉은 태양이 더 밝아지고, 작은 흰 태양이 밀려난다. 하늘 색이 황금에서 주황으로. 이중 그림자의 각도가 변한다 — 불안정." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<figure id="p8-3"><img src="../../../episodes/EP003/panels/assets/p8-3.webp" alt="상구가 주희에게 달려간다. 무릎을 꿇고 보고한다. 주희의 표정이 굳는다. 왕먀오가 멀리서 이 장면을 본다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>상구</strong>...대왕. 두 태양의 궤도가... 예측선에서 벗어나고 있습니다.</p></figcaption></figure>
<figure id="p8-4"><img src="../../../episodes/EP003/panels/assets/p8-4.webp" alt="주희의 클로즈업. 표정이 완전히 리얼리스틱하다 — 닥터슬럼프풍 과장이 완전히 사라짐. 권력자의 진짜 얼굴. 입술이 일자로 닫힌다. 턱 근육이 보인다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>주희</strong>얼마나.</p></figcaption></figure>
<h2 id="page-9">09</h2><figure id="p9-1"><img src="../../../episodes/EP003/panels/assets/p9-1.webp" alt="상구가 관측기를 가리키며 보고한다. 청동 원반 위에 세 개의 원이 그려져 있다 — 복잡하게 얽힌 궤도선. 상구의 손가락이 세 번째 원을 짚는다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>상구</strong>예측이... 불가능합니다. 세 개의 천체가 서로의 중력을 —</p></figcaption></figure>
<figure id="p9-2"><img src="../../../episodes/EP003/panels/assets/p9-2.webp" alt="상구의 얼굴. 공포. 입이 떨린다. 눈이 크게 떨린다. 그가 말을 잇는다. 닥터슬럼프풍 과장 — 눈이 만화적으로 크지만, 뺨에 흐르는 땀이 리얼리스틱. 과장과 리얼리즘의 충돌이 불안감을 극대화." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>상구</strong> — 삼체문제(三體問題)입니다. 세 개의 태양이 서로의 궤도를 교란하고 있습니다.</p></figcaption></figure>
<figure id="p9-3"><img src="../../../episodes/EP003/panels/assets/p9-3.webp" alt="하늘 수평선 클로즈업. 북쪽 수평선 아래에서 — 붉은 빛이 스며나오기 시작. 세 번째 태양. 아직 떠오르지 않았지만, 빛이 지면을 핥기 시작. 돌들이 다시 진동한다." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<figure id="p9-4"><img src="../../../episodes/EP003/panels/assets/p9-4.webp" alt="왕먀오의 반응. 안경을 벗어 직접 눈으로 본다. 안경 없이도 수평선의 붉은 빛이 보인다. 동공이 확장. 입술이 떨린다. 손에 쥔 안경이 미세하게 흔들린다." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>왕먀오</strong>세 번째...</p></figcaption></figure>
<h2 id="page-10">10</h2><figure id="p10-1"><img src="../../../episodes/EP003/panels/assets/p10-1.webp" alt="풀 스프레드. 갈색 대지 위에 무릎 꿇은 왕먀오. 손가락으로 흙 위에 수식을 쓰고 있다 — 미분 방정식, 중력 상수, 궤도 계산식. 그러나 중간부터 선이 끊기고, 숫자가 흐려진다. 수식이 흙에 파이지 않고 뭉개진다. 하늘은 붉게 물들기 시작했다. 왕먀오의 얼굴 절반만 붉은 빛, 절반은 갈색 그늘. 안경 렌즈에 하늘의 붉은 기운과 — 잠깐 — 카운트다운 숫자 &quot;1197:...&quot;가 겹쳐 비치고 사라진다. 흩어진 계산 자국. 왕먀오의 손이 멈춰 있다. 입이 벌어져 있으나 말이 없다. 하늘을 올려다보는 눈." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<h2 id="page-11">11</h2><figure id="p11-1"><img src="../../../episodes/EP003/panels/assets/p11-1.webp" alt="왕먀오가 일어선다. 흙 위의 수식을 뒤로하고. 하늘을 본다. 계산을 멈추고 — 그냥 보기로 했다. 표정에 오만이 사라지고, 순수한 관찰자의 눈이 남았다." loading="lazy" decoding="async"><figcaption><p class="narration">계산은 멈춘다. 그냥... 봐야 한다.</p></figcaption></figure>
<figure id="p11-2"><img src="../../../episodes/EP003/panels/assets/p11-2.webp" alt="수평선 전경. 동쪽에 큰 붉은 태양. 서쪽에 작은 흰 태양. 북쪽 수평선에서 — 세 번째 태양이 천천히 올라온다. 붉은 빛이 땅을 핥는다. 세 개의 빛이 교차. 그림자가 세 개." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<figure id="p11-3"><img src="../../../episodes/EP003/panels/assets/p11-3.webp" alt="주희가 평원 한가운데 선다. 무너지는 관측대 아래. 양팔을 벌리고 세 번째 태양을 맞이하는 포즈. 주희의 얼굴에 — 미소가 돌아왔다. 하지만 이번에는 다른 미소다. 체념의 미소. 수용의 미소." loading="lazy" decoding="async"><figcaption></figcaption></figure>
<h2 id="page-12">12</h2><figure id="p12-1"><img src="../../../episodes/EP003/panels/assets/p12-1.webp" alt="풀 페이지. 하늘 전체를 세 개의 태양이 가득 채운다. 구도: 위에서부터 시계 방향으로 큰 붉은 태양, 작은 흰 태양, 세 번째 붉은 태양. 지면은 화면 하단 1/5에만. 주희가 평원 한가운데 서서 양팔을 벌린 채 세 태양을 맞이하고 있다 — 옷이 타들어가기 시작. 주희의 몸에서 연기가 오른다. NPC 문명인들이 비명과 함께 녹아내린다 — 과장된 포즈로. 왕먀오는 화면 오른쪽 아래 구석에서 손으로 눈을 가리고 있다. 안경 렌즈가 세 태양의 빛에 백색으로 타오른다 — 렌즈가 거울처럼 변했다. 빛이 사방에서 쏟아진다. 그림자가 완전히 사라진 세계." loading="lazy" decoding="async"><figcaption><p class="dialogue"><strong>주희</strong>기록만이 살아남는다.</p></figcaption></figure>
<h2 id="page-13">13</h2><figure id="p13-1"><img src="../../../episodes/EP003/panels/assets/p13-1.webp" alt="NPC 문명의 건물이 녹아내린다. 돌기둥이 액체처럼 흘러내린다." loading="lazy" decoding="async"><figcaption><p class="sfx">끼이이익— 콰과과괵</p></figcaption></figure>

<h2 id="page-15">15</h2><figure id="p15-1"><img src="../../../episodes/EP003/panels/assets/p15-1.webp" alt="풀 페이지. 왕먀오의 안경 클로즈업. 왕먀오가 안경을 쓴 순간 — 렌즈 안에 카운트다운 숫자가 선명하게 비친다. 1197:32:08. 게임 접속 전보다 줄어든 숫자. 게임 안의 체감 시간과는 일치하지 않는다. 숫자 너머로 희미하게 — 세 개의 태양 잔상이 렌즈에 겹쳐 보인다. 왕먀오의 눈동자가 렌즈 너머로 보인다 — 동공이 확장되어 있다. 입이 미세하게 떨린다. 배경은 완전히 어두운 연구실 — 모니터의 미세한 빛만." loading="lazy" decoding="async"><figcaption><p class="screen">1197:32:08</p><p class="dialogue"><strong>왕먀오</strong>...이건 게임이 아니야.</p></figcaption></figure></main><footer><nav><a href="#">맨 위로</a><a href="../EP004/read.html">다음 화 →</a></nav></footer></html>
