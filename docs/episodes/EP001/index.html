<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <title>EP001 태초의 밤 | CLE3</title>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#090a0f;color:#eee;font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}a{color:#8fdcff}.shell{width:min(100%,1040px);margin:auto;padding:24px 16px 80px}.hero{padding:32px 0 28px;border-bottom:1px solid #292c36}.eyebrow{color:#8fdcff;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}.hero h1{margin:.35rem 0;font-size:clamp(2rem,7vw,4.3rem);line-height:1}.hero p{max-width:680px;color:#aeb4c4;line-height:1.7}.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.badge{border:1px solid #343946;border-radius:999px;padding:7px 11px;color:#cdd3df;font-size:.82rem}.badge.pass{border-color:#2f8d70;color:#7ee4bd}.page{padding-top:44px}.page-head{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid #242733;margin-bottom:16px}.page h2{font-size:1rem;letter-spacing:.08em}.page-count{color:#71798b;font-size:.78rem}.panels{display:grid;gap:14px}.panel{margin:0;background:#11131a;border:1px solid #242733;border-radius:8px;overflow:hidden}.panel img{display:block;width:100%;height:auto;background:#050608}.panel figcaption{padding:9px 12px;color:#8e96a8;font-size:.75rem}.footer{margin-top:60px;padding-top:24px;border-top:1px solid #242733;color:#777f91;font-size:.82rem;line-height:1.7}@media(min-width:760px){.panels{grid-template-columns:repeat(2,minmax(0,1fr))}.panel:only-child{grid-column:1/-1}.page[data-page="6"] .panel,.page[data-page="8"] .panel,.page[data-page="14"] .panel,.page[data-page="16"] .panel{grid-column:1/-1}}
  </style>
</head>
<body>
  <main class="shell">
    <a href="../../">← CLE3 홈</a>
    <header class="hero">
      <div class="eyebrow">Creative Loop Engineering 3 · Episode 001</div>
      <h1>태초의 밤</h1>
      <p>세 개의 태양에서 시작된 질문이 40년 뒤 한 물리학자의 모니터로 되돌아오는 16페이지 연재 만화입니다. Character Bible, 상태 연속성, 결정론적 한글 오버레이를 적용한 승인본입니다.</p>
      <div class="status">
        <span class="badge pass">Phase 5 PASS · 43/50</span>
        <span class="badge">16페이지</span>
        <span class="badge">49패널</span>
        <span class="badge">Release approved</span>
      </div>
    </header>
    <div id="episode" aria-live="polite"></div>
    <footer class="footer">
      모든 대사와 자막은 승인된 원본 이미지 위에 SVG로 결정론적으로 조립됐습니다.<br>
      <a href="./exports/cle5-bible-export.json">CLE5용 승인 Bible Snapshot JSON</a>
    </footer>
  </main>
  <script>
    const pages = [
      ['p1-1','p1-2','p1-3'],
      ['p2-1','p2-2','p2-3','p2-4'],
      ['p3-1','p3-2','p3-3'],
      ['p4-1','p4-2','p4-3','p4-4'],
      ['p5-1','p5-2','p5-3'],
      ['p6-1'],
      ['p7-1','p7-2','p7-3','p7-4'],
      ['p8-1'],
      ['p9-1','p9-2','p9-3','p9-4','p9-5','p9-6'],
      ['p10-1','p10-2','p10-3'],
      ['p11-1','p11-2','p11-3','p11-4'],
      ['p12-1','p12-2','p12-3','p12-4'],
      ['p13-1','p13-2','p13-3','p13-4'],
      ['p14-1'],
      ['p15-1','p15-2','p15-3'],
      ['p16-1']
    ];
    const root = document.querySelector('#episode');
    pages.forEach((panelIds,index)=>{
      const section=document.createElement('section');
      section.className='page';section.dataset.page=String(index+1);
      section.innerHTML=`<div class="page-head"><h2>PAGE ${String(index+1).padStart(2,'0')}</h2><span class="page-count">${panelIds.length} PANEL${panelIds.length>1?'S':''}</span></div><div class="panels"></div>`;
      const grid=section.querySelector('.panels');
      panelIds.forEach(id=>{
        const figure=document.createElement('figure');figure.className='panel';
        figure.innerHTML=`<img src="./panels/final/${id}.svg" alt="EP001 ${id}" loading="lazy" decoding="async"><figcaption>${id.toUpperCase()}</figcaption>`;
        grid.appendChild(figure);
      });
      root.appendChild(section);
    });
  </script>
</body>
</html>
