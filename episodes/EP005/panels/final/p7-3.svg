<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1292" viewBox="0 0 1536 1292"><rect width="100%" height="100%" fill="#11151c"/><image href="../assets/p7-3.webp" width="1536" height="1024"/><text x="41" y="1093.7" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="41" fill="#f6f0e5">청신: 그들의 감시자가 있었습니다. 우리는 그를</text>
<text x="41" y="1155.7" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="41" fill="#f6f0e5">'소페르'라고 불렀죠. 소페르는 과학자들의 눈에 — 망막에</text>
<text x="41" y="1217.7" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="41" fill="#f6f0e5">직접 메시지를 투영했습니다.</text></svg>
