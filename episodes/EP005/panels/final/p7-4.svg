<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1292" viewBox="0 0 1536 1292"><rect width="100%" height="100%" fill="#11151c"/><image href="../assets/p7-4.webp" width="1536" height="1024"/><text x="41" y="1093.7" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="41" fill="#f6f0e5">왕먀오: 그래서... 그 과학자들은 밤하늘을 본 겁니까?</text>
<text x="41" y="1155.7" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="41" fill="#f6f0e5">청신: 경고를 받은 겁니다. '연구를 멈춰라.'</text>
<text x="41" y="1217.7" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="41" fill="#f6f0e5">하지만...</text></svg>
