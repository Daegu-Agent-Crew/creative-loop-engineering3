<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1292" viewBox="0 0 1536 1292"><rect width="100%" height="100%" fill="#11151c"/><image href="../assets/p5-2.webp" width="1536" height="1024"/><text x="41" y="1093.7" font-family="'Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="41" fill="#f6f0e5">시민: 태양은 하나다. 항상 그래왔다.</text>
